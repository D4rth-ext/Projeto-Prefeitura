spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/manutencao}
    username: ${DB_USER:manutencao}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate      # o Flyway cria as tabelas; o Hibernate só confere
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    segredo: ${JWT_SECRET}
    expiracao-minutos: 480
  whatsapp:
    verify-token: ${WHATSAPP_VERIFY_TOKEN:}
    app-secret: ${WHATSAPP_APP_SECRET:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    api-version: ${WHATSAPP_API_VERSION:v23.0}

server:
  port: ${PORT:8080}
